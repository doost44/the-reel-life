# The Reel Life: settings you edit by hand.
#
# Screen layouts, which camera each source shows, the detection camera and
# which monitor each screen opens on are set in the editor
# (http://localhost:8765/editor) and saved to setup.json, not here.

server:
  port: 8765

cameras:
  # Used for the first layout, when there's no setup.json yet.
  default_device: "USB3 Video"
  # Preview frames sent to the editor and the screens. The swipe detector
  # (from Phase 3) reads full frames directly and isn't limited by these.
  preview_fps: 30
  preview_max_width: 960
  jpeg_quality: 80
  # A frame this flat (largest per-colour standard deviation) that is also
  # black or the converter's blue "no input" screen counts as no signal.
  no_signal_flatness: 6
  # How long to wait before trying a missing or dropped camera again.
  reconnect_seconds: 2

detection:
  # Finding the phone at any angle: a lit area with four straight edges and
  # a dark bezel just outside them. Lock its position in the editor once the
  # phone sits in a cradle; then none of these matter.
  min_screen_brightness: 45   # 0-255, in each pixel's strongest colour: the lowest level tried
  min_area: 0.01              # fraction of the camera picture
  max_area: 0.6
  min_edge_support: 0.55      # share of the outline that must look like a screen edge (lit inside, dark bezel outside)
  max_bezel_brightness: 100   # just outside the screen is darker than this
  min_screen_fill: 0.35       # share of the middle that must be lit (an outlined box isn't a screen)
  search_seconds: 0.25        # when not tracking, search the whole picture this often (searching is slow)
  hold_seconds: 1.5           # keep the last outline this long when it can't be seen
  # The phone area counts as a screen (not the empty mat) when it's brighter
  # than this on average, or has more texture than this.
  screen_brightness: 50
  screen_texture: 22
  # Turn the straightened screen (0, 90, 180 or 270) if swiping to the next
  # reel shows up as "back" in the debug view.
  rotate: 0
  # Movement, in fractions of the phone screen's height.
  min_step: 0.012             # less movement between two frames than this is noise or the video itself
  min_response: 0.05          # how clearly the whole screen moved (phase correlation); below this is ignored
  swipe_travel: 0.35          # a swipe has moved the screen at least this far
  min_follow_through: 0.08    # ...and this far besides its biggest single-frame jump (a scene cut is one jump)
  max_swipe_seconds: 0.5      # ...within this long of starting (slower is a hand moving the phone)
  refractory_seconds: 0.3     # no new swipe this soon after the last one landed (that's it settling)
  settle_frames: 3            # still frames that end a swipe...
  still_clarity: 0.35         # ...measured at least this clearly (blurred mid-swipe frames read as still)

# The visit, as a journey (eye/journey.py): nobody there, a face seen ("I see
# you."), the faceless oracle speaking, then the phone on the platform and the
# face forming from the reels watched. All the oracle's words are here.
journey:
  burst_seconds: 2.5          # the energy bursts to life on its own, before the oracle speaks
  line_seconds: 4.5           # each of the oracle's lines stays this long
  place_after: 1.5            # the phone on the platform this long: placed
  leave_after: 10             # nobody there and no phone this long: the visit is over, and everything made of it is wiped
  ask_patience: 25            # no reels this long after asking: "download it"
  download_patience: 90       # ...and still none this long after that: "then leave"
  becomes_seconds: 3          # the climax: the face becoming the person
  becomes: 0.85               # how far it becomes them: 1 is only their picture, less keeps the reels under the skin
  fracture_seconds: 1.4       # ...then fracturing, quickly, with the scream
  dark_seconds: 3             # dark, before their face comes back
  still_seconds: 45           # their face and the code to take it away stay this long, or until they've gone
  rest_seconds: 10            # dark again before anyone can start a new visit
  restart_after: 30           # someone who never left only starts again after this long
  oracle:
    place: ["Place your phone on the platform to begin."]
    ask: ["I have never seen an Instagram reel.", "Will you watch some with me?"]
    begin: ["Thank you."]
    download: ["You do not have it?", "Download it. I will wait."]
    leave: ["Then leave."]

# Their still at the end. It's held in memory for a few minutes, and the code leads to a page only
# phones on the same network can reach, with a link nobody could guess. Windows may ask to allow this.
still:
  port: 8766                  # the only thing on this computer that other devices can reach
  host: ""                    # this computer's address on that network; empty finds it (the hotspot's first)
  keep_seconds: 300           # the still is deleted after this long, or as soon as a new visit starts

# The reel face (eye/reel_face.py, eye/formation.py, web/js/reelface.js): the
# participant's face, tracked live on the face camera, formed tile by tile out
# of the reels they watch. Held in memory for one visit; nothing is saved.
reel_face:
  # With no face camera chosen, this clip plays instead, labelled on screen as test tracking.
  # It's tracked in git (faces/ isn't), so GitHub Pages has it too: H.264, small (see web/assets/test-face/README.md).
  test_face_clip: "web/assets/test-face/bored.mp4"
  min_watch_seconds: 1.2      # a reel counts if watched at least this long, not just scrolled past
  sample_seconds: 0.3         # how often a still of the phone screen is taken while a reel plays
  stills_per_reel: 3
  reel_seconds: 6             # one reel's fragments arrive over this long, however many there are (half that when reels pile up)
  queue_tiles: 6              # the next reel is planned once fewer than this many tiles wait
  desire_cap: 1.0             # desire rises with the face, to the climax
  # The face speaks for the participant, in the first person, wanting more. Its mouth moves
  # with the words, not with theirs; its eyes and head stay theirs.
  voice:
    speak_from: 0.04          # it starts once the face is this far formed
    words:                    # by desire: the first list early and faint, the last when it's most desiring
      - ["more"]
      - ["again", "one more"]
      - ["don't stop", "more, more"]
    gap_seconds: [7, 2.5]     # between words: with no desire, and at full (more insistent as it rises)
    clips: "voice"            # recorded words (see voice/README.md) (more.wav, again.wav, dont-stop.wav...) play instead of the computer's voice when there
  # How far the face has got (eye/distortion.py): progress runs from 0 to 1, mostly with the
  # reels watched (full at full_at_reels), partly with the seconds watched (full at
  # full_at_seconds). How it looks along the way is set in the look editor (/look).
  distortion:
    full_at_reels: 30
    full_at_seconds: 180

# What the system learns about a visitor, held in memory for one visit only
# (eye/profile.py, web/js/eye/profile.js): every reel counted, how long it was
# watched, whether it was liked, and, once there's a classifier, its category.
# Each reel weighs on its category: likes most, then a full watch, then a partial
# one; reels swiped past take a little away. Wiped with the visit like everything else.
profile:
  full_watch_seconds: 8       # watched this long counts as watched to the end (a reel's length isn't known)
  weights:
    like: 3                   # each like
    full_watch: 1
    partial_watch: 0.4        # watched, but less than full_watch_seconds
    revisit: 0.5              # came back to it with a swipe back
    skip: -0.15               # swiped past too soon to count: once skipped reels can be classified (phase 2), taken from their category
  # Where likes can come from. Each one can be switched off here; the operator's
  # test likes always work.
  like_sources:
    key: true                 # a key on a screen: the like pad (a USB arcade button or Makey Makey) types it
    heart: true               # the like button on the phone's screen turning red (click it once in the Detection view)
  like_keys: ["l"]            # which keys are a like (a Makey Makey sends space, arrows, w a s d f g, or a click)
  unclassified: "Unclassified"  # a reel's category while the classifier is still looking at it

# Seeing a like on the phone's own screen (eye/hearts.py, web/js/eye/hearts.js).
# Click the like button once on a Detection view to say where it is; then each
# frame the eye looks at a small square there on the straightened screen. The
# button turning a saturated red, and staying red, is a like; red going away is
# an unlike. Red video under the button can't trigger it: only that square is
# looked at, and only while the screen sits still. A double-tap on the video
# fills the same button, so it's caught too.
hearts:
  box: 0.07                   # the square looked at, as a fraction of the screen's width
  red_hues: [168, 8]          # OpenCV hue (0-180) range that counts as the heart's red: 168-180 and 0-8 (≈ 335°-16°)
  min_saturation: 120         # 0-255
  min_value: 110
  red_share: 0.22             # this share of the square red: filled
  outline_share: 0.08         # ...and below this: an outline (between the two holds the last state)
  frames: 3                   # the same for this many frames in a row, while the screen is still, before it counts
  settle_seconds: 0.4         # after a swipe lands, the new reel's button is only read after this long (its state is learnt, not a like)
  max_drift: 0.03             # the phone's outline moved more than this (fraction of the screen's diagonal) since the button was read: hold

# A capture of the reel at the moment of a like, for the classifier. Taken from
# stills the sampler takes faster while a reel plays, held for a moment, never
# saved: the sharpest one from just before the tap (the tap puts a thumb and a
# heart over the picture). Before anything sees it, the screen's edges are cut
# away (the status bar with notifications, the caption, username and comments,
# the button rail) and anything left that looks like text is blurred.
capture:
  every_seconds: 0.1          # how often a still goes into the buffer while a reel plays
  buffer_seconds: 1.5         # how far back the buffer reaches
  before_tap: 0.05            # only stills at least this long before the like
  crop: {top: 0.09, bottom: 0.27, left: 0.0, right: 0.17}   # fractions of the upright screen cut away
  blur_text: true             # blur anything left that looks like lines of text
  thumbnail_width: 54         # the tiny, degraded picture the screens may show of it (the HUD, the receipt)

# Sorting reels into categories (eye/classifier.py, web/js/eye/classifier.js):
# CLIP ViT-B/32, on this computer, never online. Each category is described by
# a few sentences; a picture belongs to the one it's most like. After changing
# any category or sentence, run tools/embed_categories.py (it turns the
# sentences into what the classifier compares against; the Health panel says
# when that's needed). Every reel watched is classified from one of its stills;
# a liked reel from its capture, which wins.
classifier:
  model: "web/vendor/clip/vision_model_bnb4.onnx"     # Xenova/clip-vit-base-patch32, 4-bit (58 MB), MIT licence
  embeddings: "web/vendor/clip/categories.json"       # made by tools/embed_categories.py
  logit_scale: 100            # CLIP's own: how sharply the confidence picks one category
  floor: 0.3                  # less confident than this: Unreadable
  unreadable: "Unreadable"
  categories:
    - name: "Food"
      prompts: ["a photo of a plate of food", "someone cooking in a kitchen", "a close-up of a burger, pizza or dessert",
                "a recipe video", "street food being served", "a person eating"]
    - name: "Beauty / fashion"
      prompts: ["a makeup tutorial", "a close-up of a face with makeup", "an outfit try-on in a mirror",
                "a fashion model posing", "skincare products", "a hairstyle being done"]
    - name: "Money / luxury"
      prompts: ["a luxury sports car", "a stack of cash", "a mansion with a pool", "designer watches and jewellery",
                "a private jet", "a stock market chart on a phone"]
    - name: "Comedy / memes"
      prompts: ["a meme with text over a picture", "a funny reaction face", "a comedy skit filmed on a phone",
                "a cartoon meme", "people laughing at a prank", "a screenshot of a funny tweet"]
    - name: "Pets / cute"
      prompts: ["a cute dog", "a cat", "a puppy or kitten", "a baby animal", "a pet doing something funny",
                "a small fluffy animal"]
    - name: "Fitness / sport"
      prompts: ["a person lifting weights at the gym", "a workout video", "a football match", "a basketball dunk",
                "someone running", "a person doing yoga"]
    - name: "Outrage / news"
      prompts: ["a news broadcast", "a protest in the street", "a politician speaking at a podium",
                "a headline with breaking news", "a person ranting angrily into the camera", "a fire or disaster scene"]
    - name: "Travel / scenery"
      prompts: ["a beach at sunset", "mountains and a lake", "a city skyline at night", "a hotel infinity pool",
                "a drone shot of a landscape", "a tropical island"]
    - name: "Music / dance"
      prompts: ["people dancing", "a concert with a crowd and stage lights", "someone singing into a microphone",
                "a dance trend video", "a DJ at a party", "a person playing guitar"]

# How each category shows in the face (A3 phase 3: eye/look.py, reelface.js). These
# are the defaults: the look editor's Categories group tunes them and saves them with
# the look (setup.json), like any other setting.
#   regions   where its fragments land on the face: eyes, brows, forehead, nose, mouth,
#             cheeks, jaw, skin (the face but its features), whole
#   material  how its fragments are treated as they land: gloss, porcelain, gold, deepfried,
#             glassy, tight, cracked, sunset, smear (or none)
#   pushes    look settings it pushes, by how much at the first reels and at the full face,
#             in the setting's own units; scaled by the category's share of the visit
#   material_amount  how strong the material is, at the first reels and at the full face
category_looks:
  region_share: 0.6           # of a watched reel's face fragments, this share land in its category's regions
  region_fit: 1.5             # a fragment in its regions is at most this many times the regions' own radius (so the eyes stay the eyes)
  wait_seconds: 2.0           # a reel waits this long for its category before it's cut anyway (unsorted)
  liked:                      # a liked reel's fragments: all in its regions, bigger, sharper, with a pulse
    region_share: 1.0
    size: 1.6                 # times the usual fragment size
    damage: 0.3               # times the usual JPEG damage and colour bleed
    pulse_seconds: 1.6        # how long the bright pulse lasts as one lands
  categories:
    "Food":
      regions: [mouth, cheeks]
      material: gloss
      material_amount: [0.5, 0.9]
      pushes: {gloss: [0.15, 0.4], melt: [0.05, 0.25]}
    "Beauty / fashion":
      regions: [skin]
      material: porcelain
      material_amount: [0.5, 0.9]
      pushes: {likeness: [0.1, 0.2], jpeg: [-0.05, -0.2]}
    "Money / luxury":
      regions: [eyes, jaw]
      material: gold
      material_amount: [0.5, 0.9]
      pushes: {gloss: [0.1, 0.25], fracture: [0.0, 0.1]}
    "Comedy / memes":
      regions: [mouth]
      material: deepfried
      material_amount: [0.6, 1.0]
      pushes: {jpeg: [0.15, 0.3], bleed: [0.1, 0.3], stretch: [0.05, 0.2]}
    "Pets / cute":
      regions: [eyes]
      material: glassy
      material_amount: [0.5, 0.9]
      pushes: {faint: [0.05, 0.1], melt: [0.05, 0.15]}
    "Fitness / sport":
      regions: [jaw, brows]
      material: tight
      material_amount: [0.5, 0.9]
      pushes: {stretch: [0.1, 0.3], melt: [-0.05, -0.2]}
    "Outrage / news":
      regions: [forehead, cheeks]
      material: cracked
      material_amount: [0.5, 1.0]
      pushes: {flush: [0.15, 0.35], fracture: [0.1, 0.3]}
    "Travel / scenery":
      regions: [skin]
      material: sunset
      material_amount: [0.4, 0.8]
      pushes: {heat: [0.1, 0.3], bleed: [0.05, 0.2]}
    "Music / dance":
      regions: [whole]
      material: smear
      material_amount: [0.4, 0.8]
      pushes: {mosh: [0.05, 0.15], flow: [0.1, 0.3]}

browser:
  # Chrome or Edge, for opening screens fullscreen on their monitors.
  # Leave empty to find it automatically.
  path: ""
